name: Go Version and Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: 'Exact version (e.g. 1.2.3). Cannot be used with bump_type.'
        required: false
      bump_type:
        description: 'Component to bump: major | minor | patch. Cannot be used with version.'
        required: false
      version_force:
        description: 'Force specified `version`, ignoring strict version progression checks.'
        required: false
      go_version:
        description: 'Go version to install.'
        required: false
      apt_repo:
        description: 'Optional target GitHub repository in owner/name form for publishing generated .deb artifacts as an apt repository.'
        required: false
        default: 'MiguelRodo/apt-miguelrodo'
      goreleaser_config:
        description: "Optional path to the GoReleaser config file."
        required: false
        default: ".goreleaser.yml"
# Serialize automatic and manual releases; never cancel a release in progress.
concurrency:
  group: setupmjr-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # Pushes to main release automatically when conventional commits since the
      # last tag include feat, fix, perf or a breaking change.
      - name: Determine automatic bump
        id: auto
        if: github.event_name == 'push'
        run: |
          bump="$(bash .github/scripts/release-bump.sh)"
          echo "bump=$bump" >> "$GITHUB_OUTPUT"
          echo "Automatic release bump: ${bump:-none}" >> "$GITHUB_STEP_SUMMARY"
      - name: Require signed APT publication
        if: github.event_name == 'workflow_dispatch' || steps.auto.outputs.bump != ''
        env:
          APT_SIGNING_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          APT_REPO_TOKEN: ${{ secrets.APT_REPO_TOKEN }}
        run: |
          test -n "$APT_SIGNING_KEY" || { echo '::error::GPG_PRIVATE_KEY is required'; exit 1; }
          test -n "$APT_REPO_TOKEN" || { echo '::error::APT_REPO_TOKEN is required'; exit 1; }
      - uses: MiguelRodo/actions/go-version-release@bf850afe48d42ac221079cfede39021d0574c15a # v3.0.0
        id: publish
        if: github.event_name == 'workflow_dispatch' || steps.auto.outputs.bump != ''
        env:
          SCOOP_TAP_TOKEN: ${{ secrets.SCOOP_TAP_TOKEN }}
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          apt_repo_token: ${{ secrets.APT_REPO_TOKEN }}
          apt_signing_key: ${{ secrets.GPG_PRIVATE_KEY }}
          apt_signing_key_passphrase: ${{ secrets.GPG_PASSPHRASE }}
          version: ${{ inputs.version }}
          bump_type: ${{ inputs.bump_type || steps.auto.outputs.bump }}
          version_force: ${{ inputs.version_force }}
          go_version: ${{ inputs.go_version }}
          apt_repo: ${{ inputs.apt_repo || 'MiguelRodo/apt-miguelrodo' }}
          goreleaser_config: ${{ inputs.goreleaser_config || '.goreleaser.yml' }}
          scoop_token: ${{ secrets.SCOOP_TAP_TOKEN }}
          homebrew_token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      # Consumer smoke check: use APT itself to validate signatures and index hashes.
      # Packaging, signing and pushing remain owned by MiguelRodo/actions.
      - name: Verify published APT version
        if: github.event_name == 'workflow_dispatch' || steps.auto.outputs.bump != ''
        timeout-minutes: 10
        env:
          VERSION: ${{ steps.publish.outputs.version }}
          APT_REPO: ${{ inputs.apt_repo || 'MiguelRodo/apt-miguelrodo' }}
        shell: bash
        run: |
          set -euo pipefail
          base="https://${APT_REPO%%/*}.github.io/${APT_REPO##*/}"
          check_dir="$(mktemp -d)"
          chmod 755 "$check_dir"
          trap 'sudo rm -rf "$check_dir"' EXIT
          curl --fail --silent --show-error --location "$base/KEY.gpg" | gpg --dearmor > "$check_dir/key.gpg"
          echo "deb [arch=amd64,arm64 signed-by=$check_dir/key.gpg] $base stable main" > "$check_dir/sources.list"
          mkdir "$check_dir/lists"
          sudo dpkg --add-architecture arm64
          options=(-o "Dir::Etc::sourcelist=$check_dir/sources.list" -o Dir::Etc::sourceparts=- -o "Dir::State::lists=$check_dir/lists" -o Dir::Cache::pkgcache= -o Dir::Cache::srcpkgcache= -o Dir::State::status=/dev/null)
          # GitHub Pages may lag behind the push. Retry within the step timeout.
          for attempt in {1..20}; do
            if sudo apt-get "${options[@]}" update --error-on=any &&
               apt-cache "${options[@]}" show "setupmjr:amd64=$VERSION" >/dev/null &&
               apt-cache "${options[@]}" show "setupmjr:arm64=$VERSION" >/dev/null; then
              echo "Verified signed APT indexes contain setupmjr $VERSION for amd64 and arm64." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "Waiting for signed APT indexes ($attempt/20)..."
            sleep 15
          done
          echo "::error::Published signed APT indexes do not contain setupmjr $VERSION for both architectures"
          exit 1
