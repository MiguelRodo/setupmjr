name: Test Installation Methods

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  # Test the Debian package built from this commit without depending on the
  # separately published repos package being reachable.
  test-debian-package:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Install GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          install-only: true
          version: '~> v1'

      - name: Build Debian package
        run: goreleaser release --snapshot --clean

      - name: Install Debian package built from this commit
        run: sudo dpkg --ignore-depends=repos -i dist/*_amd64.deb

      - name: Verify setupmjr command
        run: |
          command -v setupmjr
          setupmjr --help

  # Test local installation from a release-shaped binary built from this commit.
  test-local-installation:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Build fake release binary
        run: |
          mkdir -p /tmp/fake-release
          go build -o /tmp/fake-release/setupmjr_linux_amd64 ./cmd/setupmjr

      - name: Run local installation script
        env:
          SETUPMJR_DOWNLOAD_BASE_URL: "file:///tmp/fake-release"
        run: |
          mkdir -p "$HOME/.local/bin"
          printf '#!/usr/bin/env bash\nexit 0\n' > "$HOME/.local/bin/repos"
          chmod +x "$HOME/.local/bin/repos"
          export PATH="$HOME/.local/bin:$PATH"
          bash install-local.sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Verify local installation
        run: |
          command -v setupmjr
          test -x "$HOME/.local/bin/setupmjr"
          setupmjr --help

  # Published APT is an integration check for the release repository, not PR
  # validation. Run it explicitly when repository availability is what matters.
  test-published-apt-repository:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Install APT repository prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y curl gpg

      - name: Configure published APT repository
        run: |
          curl -fsSL https://miguelrodo.github.io/apt-miguelrodo/KEY.gpg \
            | sudo gpg --dearmor -o /usr/share/keyrings/apt-miguelrodo.gpg
          echo "deb [signed-by=/usr/share/keyrings/apt-miguelrodo.gpg] https://miguelrodo.github.io/apt-miguelrodo stable main" \
            | sudo tee /etc/apt/sources.list.d/apt-miguelrodo.list >/dev/null
          sudo apt-get update

      - name: Install published setupmjr package and dependencies
        run: sudo apt-get install -y setupmjr

      - name: Verify published package
        run: |
          setupmjr --help
          PKG_ARCH="$(dpkg-query -W -f='${Architecture}' setupmjr)"
          HOST_ARCH="$(dpkg --print-architecture)"
          if [ "$PKG_ARCH" = "all" ]; then
            echo "Error: expected architecture-specific package, got Architecture: all"
            exit 1
          fi
          if [ "$PKG_ARCH" != "$HOST_ARCH" ]; then
            echo "Error: installed package architecture ($PKG_ARCH) does not match host ($HOST_ARCH)"
            exit 1
          fi
          echo "Installed package architecture: $PKG_ARCH"

  # Test Windows installation from a release-shaped binary built from this commit.
  test-windows-manual:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Build fake release binary
        shell: pwsh
        run: |
          $fakeRelease = Join-Path $env:TEMP "fake-release"
          New-Item -ItemType Directory -Path $fakeRelease -Force | Out-Null
          $env:GOOS = "windows"
          $env:GOARCH = "amd64"
          go build -o (Join-Path $fakeRelease "setupmjr_windows_amd64.exe") ./cmd/setupmjr

      - name: Run install.ps1
        shell: pwsh
        run: |
          $installDir = Join-Path $env:USERPROFILE ".local\bin"
          New-Item -ItemType Directory -Path $installDir -Force | Out-Null
          Set-Content -LiteralPath (Join-Path $installDir "repos.cmd") -Value "@exit /b 0" -Encoding ascii
          $env:Path = "$installDir;$env:Path"
          $fakeRelease = Join-Path $env:TEMP "fake-release"
          $env:SETUPMJR_DOWNLOAD_BASE_URL = "file:///$($fakeRelease -replace '\\', '/')"
          .\install.ps1

      - name: Verify Windows installation
        shell: pwsh
        run: |
          $installDir = Join-Path $env:USERPROFILE ".local\bin"
          $binary = Join-Path $installDir "setupmjr.exe"
          if (!(Test-Path -LiteralPath $binary -PathType Leaf)) {
            throw "setupmjr.exe not found in expected install directory"
          }
          & $binary --help
          if ($LASTEXITCODE -ne 0) {
            throw "setupmjr --help exited with $LASTEXITCODE"
          }

  # Test a direct source build from this commit.
  test-from-source:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Build and verify setupmjr from source
        run: |
          go build -o /tmp/setupmjr ./cmd/setupmjr
          /tmp/setupmjr --help

  test-summary:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs:
      - test-debian-package
      - test-local-installation
      - test-published-apt-repository
      - test-windows-manual
      - test-from-source
    if: always()

    steps:
      - name: Check PR-code installation tests passed
        run: |
          if [ "${{ needs.test-debian-package.result }}" != "success" ]; then
            echo "Debian package tests failed"
            exit 1
          fi
          if [ "${{ needs.test-local-installation.result }}" != "success" ]; then
            echo "Local installation tests failed"
            exit 1
          fi
          if [ "${{ needs.test-windows-manual.result }}" != "success" ]; then
            echo "Windows installation tests failed"
            exit 1
          fi
          if [ "${{ needs.test-from-source.result }}" != "success" ]; then
            echo "Source-build tests failed"
            exit 1
          fi
          if [ "${{ needs.test-published-apt-repository.result }}" != "success" ] && \
             [ "${{ needs.test-published-apt-repository.result }}" != "skipped" ]; then
            echo "Published APT repository integration test failed"
            exit 1
          fi
          echo "All requested installation tests passed"
