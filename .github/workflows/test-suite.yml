name: Test Suite

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  go-tests:
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable

      - name: Run Go tests
        run: |
          go test ./... -v

  python-wrapper:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Test and install Python wrapper
        shell: bash
        run: |
          python3 -m unittest discover -s tests -p 'test_python_wrapper.py' -v
          python3 -m venv "$RUNNER_TEMP/setupmjr-python"
          "$RUNNER_TEMP/setupmjr-python/bin/pip" install .
          (cd "$RUNNER_TEMP" && "$RUNNER_TEMP/setupmjr-python/bin/python" -c 'import setupmjr; assert callable(setupmjr.run)')

  r-wrapper:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Test and install R wrapper
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y r-base-core
          mkdir -p "$RUNNER_TEMP/setupmjr-r"
          R CMD INSTALL --library="$RUNNER_TEMP/setupmjr-r" .
          R_LIBS="$RUNNER_TEMP/setupmjr-r" Rscript tests/test_r_wrapper.R
